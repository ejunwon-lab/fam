<!-- v40 책 편집 v2: 자동완성·책 허브·⋯ 메뉴·병합·삭제·되돌리기·📚 책 세그먼트 — 2026-08-16 -->
<!-- v58 ⚙️ 설정 아이콘 분리(모든 헤더), 이름 칩=표시 전용 — 2026-08-20 -->
<!-- v57 ⚙️ 설정 시트(이름 칩 탭): 알림 상태·테스트·켜기 / 가족 등록 / (아빠) 이름 다시 고르기 / 앱 버전·업데이트 확인 — 2026-08-20 -->
<!-- v56 🔔 배너 정리: 테스트 성공·✕ 후엔 숨김(pushOkSeen) — 2026-08-20 -->
<!-- v55 🔥 Firestore P1: 가족 코드 페어링(1회)·records 이중 쓰기(saveBlock/undo/memo)·live 실시간(onSnapshot) — 2026-08-20 -->
<!-- v54 전송 계층 강화: fetch keepalive + 잠금 순간 sendBeacon 위탁 발사(멱등 안전) — 큐는 최후 보루로 강등 — 2026-08-20 -->
<!-- v53 🔴 블록 저장 유실 수정: 부팅·복귀 때 famblkq 재전송(이벤트만 비우던 버그), 저장 큐 남으면 자동 새로고침 미룸, 실패 5초 재시도 — 2026-08-20 -->
<!-- v50 🔔 목표 알림: 웹푸시(FCM, push-config.js 값 있을 때만 배너·토큰 등록·테스트) + 포그라운드 목표 도달 비프/토스트 — 2026-08-18 -->
<!-- v49 📅 일정 탭 A안: 앱바 '📅 일정' + 세그먼트 [➕ 등록 · 📅 가족 일정](마지막 선택 기억), 우상단 📅 아이콘·‹ 제거, '일정 등록' 라벨, 다가오는 일정 '전체 보기 ›' — 2026-08-18 -->
<!-- v48 📅 가족 일정에 루틴 블록(블록마다 한 줄, GAS @43) + '약속만·활동 포함' 토글 — 2026-08-18 -->
<!-- v47 독서 목표 주 1권(GAS @41/V25): 📚 타일 이번 주 W/1권·올해·이달, 최근 8주 ✓ 스트립+🔥 주 연속, 목표 시트 주 단위, 완독 축하 문구 — 2026-08-18 -->
<!-- v46 프리페치 dirty 버그(옛 캐시 유지) 수정 · 집중 화면 복귀 시 재렌더 안 함 — 2026-08-18 -->
<!-- v45 폰 캐시 대책: 복귀 시 모든 화면 60초 재조회 + 새 버전 자동 새로고침(HEAD ETag 변경 → 서버 APP_VER > 내 APP_VER) — 릴리스마다 APP_VER 올릴 것 — 2026-08-18 -->
<!-- v44 횟수권 회차 칩(N/24회) — 가족 일정 목록·다가오는/최근 등록·등록 토스트 (GAS @39 seq/total) — 2026-08-18 -->
<!-- v43 📅 가족 일정 보기(앱 안, GAS @38 api=events) — 일정 탭 📅 → 월별 날짜 목록·구글 캘린더 앱 링크는 하단 — 2026-08-18 -->
<!-- v42 GAS @37 연동: 일정 탭 '다가오는 일정' + 이번 주 레슨 서버 계산(BOOT.lessons) — 2026-08-18 -->
<!-- v41 UI/UX 검토 반영: 할 일 체크→레거시 화면 버그(구 열품타 목록 뷰 제거)·휴식 칩 idle 비활성·집중화면 ☁️/durLabel·부모 'CY의 하루'·'CY의 발자국'·지난 날 기록 추가·이달 프리페치·응원 후 도크 축소·돌아보기 줄바꿈/부제 — 2026-08-18 -->
<meta name="theme-color" content="#e9f3fb">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* 밝은 크림/오렌지 톤 — CY 피드 홈과 동일한 분위기로 앱 전체 통일 (2026-07-18)
     var 이름은 유지(수정 최소화): --indigo=주황(주 강조), --teal=청록, --amber=호박 */
  :root {
    color-scheme: light;
    --bg: #e9f3fb; --ink: #24303b; --sub: #7d8fa0;
    --card: #ffffff; --line: #d6e6f3;
    --etc-bg: #eef3f8; --etc-ink: #5b6b7a;
    --indigo: #f4652f; --indigo-soft: #ffe9d8;
    --teal: #1f9080; --teal-soft: #ddf2ee;
    --amber: #c98a2e; --amber-soft: #fdf0da;
    --success: #2f9e63; --danger: #d84f4f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 14px 18px 118px; }

  /* 하단 공통 메뉴 — 피드 도크의 흰 카드 버튼과 동일한 스타일로 전 화면 통일 */
  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 480px; z-index: 4;
    background: #fff; border-top: 1px solid #d6e6f3;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .menu-row { display: flex; gap: 8px; }
  .menu-row .mn {
    flex: 1; font: inherit; text-align: center; background: #fff; border: 1px solid #d6e6f3;
    border-radius: 16px; padding: 12px 2px; font-size: 12.5px; font-weight: 700; color: #24303b;
    cursor: pointer; box-shadow: 0 2px 8px rgba(60, 100, 140, .06); white-space: nowrap;
  }
  .menu-row .mn.on { background: #ffe9d8; border-color: #ffcfa8; color: #c2481a; }

  .appbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px 14px; }
  .appbar .t { font-size: 21px; font-weight: 800; }
  .appbar .right { display: flex; align-items: center; gap: 8px; }
  .appbar .who {
    font-size: 13px; font-weight: 700; color: var(--indigo);
    background: var(--indigo-soft); border: none; font-family: inherit;
    border-radius: 99px; padding: 6px 12px; cursor: pointer;
  }
  .iconbtn {
    width: 32px; height: 32px; border-radius: 11px; padding: 0;
    background: var(--card); border: 1px solid var(--line);
    font-size: 15px; cursor: pointer; display: grid; place-items: center;
  }
  .back { background: none; border: none; color: var(--sub); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; padding: 4px 2px; }

  .practice-cta {
    width: 100%; text-align: left; cursor: pointer; font: inherit; color: #fff;
    background: linear-gradient(135deg, #2fae9a, #1f9080);
    border: none; border-radius: 22px; padding: 18px 20px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 15px;
  }
  .practice-cta .ic { font-size: 30px; }
  .practice-cta .big { font-size: 18px; font-weight: 800; }
  .practice-cta .small { font-size: 12.5px; font-weight: 600; opacity: .82; }

  .sec-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--sub); margin: 14px 2px 8px; }

  .presets { display: flex; flex-direction: column; gap: 10px; }
  .preset {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; font: inherit; color: inherit; cursor: pointer; transition: transform .08s ease;
    box-shadow: 0 3px 14px rgba(60, 100, 140, .07);
  }
  .preset:active { transform: scale(.98); }
  .preset:focus-visible, .chip:focus-visible, .cta:focus-visible, .etc:focus-visible, .pick:focus-visible, .tbtn:focus-visible {
    outline: 2px solid var(--indigo); outline-offset: 2px;
  }
  .preset .dot {
    width: 44px; height: 44px; border-radius: 14px; flex: none;
    display: grid; place-items: center; font-size: 19px; font-weight: 800;
  }
  /* 의미 그룹별 배경 채우기: ex=운동, ac=학원~멘토링 */
  .preset[data-cat="ex"] { background: var(--teal-soft);   border-color: #bfe4dc; }
  .preset[data-cat="ex"] .dot { background: var(--teal);   color: #fff; }
  .preset[data-cat="ac"] { background: var(--indigo-soft); border-color: #ffd4b3; }
  .preset[data-cat="ac"] .dot { background: var(--indigo); color: #fff; }
  .preset .name { font-size: 17.5px; font-weight: 700; flex: 1; }
  .preset .cnt { font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .preset .cnt.full { color: var(--success); font-weight: 700; }

  .etc {
    width: 100%; margin-top: 10px; background: var(--amber-soft);
    border: 1.5px dashed var(--amber); border-radius: 18px; padding: 14px;
    font: inherit; font-size: 15.5px; font-weight: 600; color: var(--amber); cursor: pointer;
  }

  .others { margin-top: 18px; }
  .others-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; font: inherit; color: var(--sub);
    font-size: 13.5px; font-weight: 700; padding: 8px 2px; cursor: pointer;
  }
  .others-toggle .arr { transition: transform .15s ease; }
  .others.on .others-toggle .arr { transform: rotate(90deg); }
  .others-body { display: none; }
  .others.on .others-body { display: block; }
  .o-group { margin: 8px 0 4px; font-size: 12px; font-weight: 700; color: var(--sub); }
  .o-preset {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 14px; font: inherit; color: inherit; cursor: pointer; margin-bottom: 7px;
  }
  .o-preset .o-name { font-size: 15px; font-weight: 600; flex: 1; }
  .o-preset .o-tag { font-size: 11.5px; color: var(--sub); }

  .recent { display: flex; flex-direction: column; gap: 8px; }
  .recent .row {
    display: flex; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 13px; padding: 10px 14px; font-size: 13.5px;
  }
  .recent .r-t { font-weight: 600; }
  .recent .r-d { color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { color: var(--sub); font-size: 13.5px; padding: 6px 2px; }
  /* 📅 가족 일정 (v43) */
  .fclist { display: flex; flex-direction: column; }
  .fcday { display: flex; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
  .fcday:first-child { border-top: none; }
  .fcday.past { opacity: .55; }
  .fcd { flex: none; width: 40px; text-align: center; } .fcd b { display: block; font-size: 18px; font-weight: 800; line-height: 1.1; } .fcd small { font-size: 10.5px; color: var(--sub); font-weight: 700; }
  .fcday.today .fcd b { color: #ff7a3d; } .fcday.today .fcd small { color: #ff7a3d; }
  .fcitems { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .fcit { display: flex; align-items: baseline; gap: 8px; background: #f3f8fc; border-radius: 10px; padding: 7px 10px; font-size: 13.5px; }
  .fct { flex: none; font-size: 12px; color: var(--sub); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 78px; }
  .fcn { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
  .fcw { flex: none; font-size: 11.5px; font-weight: 800; color: #3d6f9e; background: #e4eefb; border-radius: 8px; padding: 2px 7px; }
  .bkweeks { display: flex; align-items: center; gap: 5px; margin: 0 0 10px; }
  .bkweeks span { width: 22px; height: 22px; border-radius: 6px; background: #eef3f8; color: #b8c6d4; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
  .bkweeks span.ok { background: #34a86b; color: #fff; } .bkweeks span.cur { box-shadow: 0 0 0 2px #ffb98a; }
  .bkweeks small { margin-left: 6px; font-size: 11.5px; color: var(--sub); font-weight: 700; }
  .iconbtn.gear { font-size: 17px; }
  .fd-top .r { display: flex; align-items: center; gap: 8px; }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 13px 2px; border-bottom: 1px solid var(--line); font-size: 14.5px; font-weight: 700; }
  .setrow:last-child { border-bottom: none; }
  .setrow > span { flex: 1; min-width: 0; } .setrow small { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-top: 2px; }
  .setrow .lk { font: inherit; font-size: 12.5px; font-weight: 800; border: 1px solid var(--line); background: #fff; color: #3d6f9e; border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .setrow .lk.on { background: #ff8a3d; border-color: #ff8a3d; color: #fff; }
  .pushb { display: flex; align-items: center; gap: 8px; background: #fff7ec; border: 1px solid #ffd9b0; border-radius: 14px; padding: 9px 12px; margin: 10px 0 0; font-size: 13px; font-weight: 700; color: #7a4a12; }
  .pushb span { flex: 1; min-width: 0; } .pushb small { display: block; font-size: 11.5px; font-weight: 600; color: #a0703a; margin-top: 2px; }
  .pushb.on { background: #eef8f1; border-color: #bfe3cb; color: #22633b; } .pushb.on small { color: #4d8a63; }
  .pushb .lk { font: inherit; font-size: 12.5px; font-weight: 800; border: 1px solid #ffbe85; background: #fff; color: #b26a1c; border-radius: 999px; padding: 5px 11px; cursor: pointer; } .pushb .lk.on { background: #ff8a3d; border-color: #ff8a3d; color: #fff; } .pushb.on .lk { border-color: #9fd3b0; color: #22633b; }
  .pushb .x { font: inherit; border: none; background: none; color: #b8955f; cursor: pointer; padding: 2px 4px; }
  .fctog { display: flex; justify-content: center; gap: 6px; margin: -4px 0 8px; }
  .fctog button { font: inherit; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: #fff; color: var(--sub); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .fctog button.on { background: #ffe3c2; border-color: #ffbe85; color: #b26a1c; }
  .fcit.rt { background: transparent; border: 1px dashed var(--line); cursor: pointer; }
  .fcit.rt .fcn { font-weight: 600; } .fcit.rt .fcn small { color: var(--sub); font-weight: 700; margin-left: 4px; }
  .fcdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
  .fcm { display: block; font-size: 12px; color: var(--sub); font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
  .fcseq { flex: none; font-size: 11.5px; font-weight: 800; color: #b26a1c; background: #fdebd2; border-radius: 8px; padding: 2px 7px; margin-left: 6px; }

  /* 타이머 */
  .timer-wrap { text-align: center; padding-top: 8px; }
  .state-pill { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .04em; padding: 6px 16px; border-radius: 99px; margin-bottom: 20px; }
  .state-idle { background: var(--card); color: var(--sub); border: 1px solid var(--line); }
  .state-practice { background: var(--teal-soft); color: var(--teal); }
  .state-break { background: var(--amber-soft); color: var(--amber); }
  .dial {
    width: 220px; height: 220px; border-radius: 50%; margin: 0 auto 8px;
    display: grid; place-items: center; border: 8px solid var(--line); transition: border-color .3s ease;
  }
  .dial.practice { border-color: var(--teal); box-shadow: 0 0 40px -12px var(--teal); }
  .dial.break { border-color: var(--amber); box-shadow: 0 0 40px -12px var(--amber); }
  .dial .clock { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dial .clabel { font-size: 12.5px; color: var(--sub); margin-top: 2px; font-weight: 700; }
  .kind-chips { display: flex; gap: 7px; justify-content: center; margin: 14px 0 6px; }
  .kchip { font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 99px; padding: 7px 14px; cursor: pointer; }
  .kchip.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .totals { display: flex; justify-content: center; gap: 26px; margin: 18px 0 24px; }
  .totals .tt { font-size: 12px; color: var(--sub); font-weight: 700; }
  .totals .tv { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .totals .practice .tv { color: var(--teal); }
  .totals .brk .tv { color: var(--amber); }
  .tbtns { display: flex; flex-direction: column; gap: 11px; padding: 0 4px; }
  .tbtn { font: inherit; font-size: 18px; font-weight: 800; border: none; border-radius: 18px; padding: 18px; cursor: pointer; }
  .tbtn.start, .tbtn.resume { background: var(--teal); color: #fff; }
  .tbtn.rest { background: var(--amber); color: #fff; }
  .tbtn.stop { background: none; border: 1.5px solid var(--line); color: var(--sub); font-size: 16px; padding: 15px; }
  .tbtn:disabled { opacity: .6; }
  .tbtn:active { filter: brightness(.93); }
  .hint { font-size: 12.5px; color: var(--sub); margin-top: 16px; }

  /* ── 열품타 메인(연습) 화면 ── */
  .yp-todo { display: flex; align-items: center; gap: 10px; padding: 7px 2px 7px 4px; cursor: pointer; }
  .yp-ring { width: 21px; height: 21px; border-radius: 50%; border: 2px solid; flex: none; display: grid; place-items: center; font-size: 11px; color: transparent; }
  .yp-todo.done .yp-ring { color: #fff; }
  .yp-tx { font-size: 14px; flex: 1; }
  .yp-todo.done .yp-tx { color: var(--faint); text-decoration: line-through; }
  .yp-rep { font-size: 10px; font-weight: 800; color: var(--amber); background: var(--amber-soft); border-radius: 99px; padding: 2px 7px; }
  .yp-edit { flex: none; background: none; border: none; padding: 4px 6px; font-size: 14px; line-height: 1; cursor: pointer; opacity: .5; }
  .yp-edit:active { opacity: 1; }

  /* ── 열품타 통계 ── */
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 12px; }
  .cal-nav .mo { font-size: 16px; font-weight: 800; }
  .cal-nav button { background: none; border: none; color: var(--sub); font-size: 17px; cursor: pointer; padding: 2px 8px; }
  .cal-nav button:disabled { opacity: .3; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--faint); font-weight: 700; padding-bottom: 2px; }
  .cal-cell { aspect-ratio: .8; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; }
  .cal-cell .cd { font-size: 11px; font-weight: 700; }
  .cal-cell .ct { font-size: 8px; font-variant-numeric: tabular-nums; opacity: .9; }
  .cal-cell.empty { visibility: hidden; cursor: default; }
  .cal-cell.sel { outline: 2px solid var(--ink); }
  .cal-legend { display: flex; align-items: center; gap: 4px; margin-top: 12px; font-size: 10px; color: var(--faint); }
  .cal-legend .lc { width: 15px; height: 12px; border-radius: 3px; }
  .cal-tot { text-align: right; font-size: 11px; color: var(--sub); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .dtl-h { text-align: center; font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .dtl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 10px; }
  .dtl .dl { font-size: 12px; font-weight: 700; color: var(--indigo); margin-bottom: 3px; }
  .dtl .dv { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .scard-t { font-size: 14px; font-weight: 800; margin-bottom: 14px; }
  .donut2 { display: flex; align-items: center; gap: 18px; }

  /** 주과목 = 주1회가 아닌 첫 과목(베이스). 디폴트: 직전 과목, 단 주1회 과목(휴식=그 과목 종료 개념)이면 주과목 복귀 */
  function primaryKind() {
    var subs = BOOT.subjects || [];
    for (var i = 0; i < subs.length; i++) if (!subs[i].weekly && (subs[i].mode === 'timer' || !subs[i].mode)) return subs[i].name;
    return subs.length ? subs[0].name : '베이스';
  }
  function defaultKind() {
    if (!sess) return primaryKind();
    var cur = (BOOT.subjects || []).find(function (s) { return s.name === sess.kind; });
    return (cur && cur.weekly) ? primaryKind() : sess.kind;
  }
  function chooseKind(cb) {
    // 연습 시작 피커 = 타이머 전용 과목만(베이스). 독서·이론은 각자 링에서 타이머 시작
    var subs = (BOOT.subjects || []).filter(function (s) { return s.mode === 'timer' || !s.mode; });
    if (subs.length <= 1) return cb(subs.length ? subs[0].name : '베이스');
    var dflt = defaultKind();
    var sorted = subs.filter(function (s) { return s.name === dflt; })
      .concat(subs.filter(function (s) { return s.name !== dflt; }));
    var ov = document.createElement('div'); ov.className = 'fd-pick';
    ov.innerHTML = '<div class="pk"><h3>어떤 연습이에요?</h3>' + sorted.map(function (s) {
      var main = s.name === dflt;
      var badge = (s.weekly && todaySec(s.name) > 0) ? '<span class="done-b">✓ 오늘 완료</span>' : '';
      return '<button class="k' + (main ? ' main' : '') + '" data-k="' + esc(s.name) + '">' +
        '<span class="kd" style="background:' + (main ? 'rgba(255,255,255,.65)' : (s.color || '#9aa4b2')) + '"></span>' +
        (main ? '▶ ' + esc(s.name) + ' 시작' : esc(s.name)) + badge + '</button>';
    }).join('') + '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (e) { if (e.target === ov) document.body.removeChild(ov); });
    ov.querySelectorAll('.k').forEach(function (b) {
      b.addEventListener('click', function () { var k = b.getAttribute('data-k'); document.body.removeChild(ov); cb(k); });

  // ── 인증샷 카메라 — getUserMedia 자동촬영 + <input capture> 폴백. 실패해도 연습은 시작된다 ──
  var SHOTKEY = 'famshots';
  function loadShots() { try { var s = JSON.parse(read(SHOTKEY) || 'null'); if (s && s.date === todayStr()) return s.shots || {}; } catch (e) {} return {}; }
  function saveShot(hm, dataUrl) { var shots = loadShots(); shots[hm] = dataUrl; try { store(SHOTKEY, JSON.stringify({ date: todayStr(), shots: shots })); } catch (e) {} }

  var camStream = null, camTimer = null, camCtx = null;
  function openCam(kind, resume) {
    if (document.body.classList.contains('cam-on')) return; // 연타 이중 오픈 방지
    camCtx = { kind: kind, resume: resume };
    $('cam').innerHTML = '<video id="camV" autoplay playsinline muted></video>' +
      '<div class="cam-top" id="camTop">📷 인증샷 — 곧 자동으로 찍혀요</div><div class="cnt" id="camCnt"></div>' +
      '<button class="cam-skip" id="camSkip">사진 없이 시작</button>';
    document.body.classList.add('cam-on');
    $('camSkip').addEventListener('click', function () { camDone(null); });
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
        .then(function (st) {
          if (!camCtx) { try { st.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
          camStream = st; $('camV').srcObject = st;
          var n = 3; $('camCnt').textContent = n;
          camTimer = setInterval(function () {
            n--; if (n > 0) { $('camCnt').textContent = n; return; }
            clearInterval(camTimer); camTimer = null; camSnap();
          }, 1000);
        })
        .catch(function () { camFilePick(); });
    } else camFilePick();
  }
  function scaleTo_(src, w, hgt, max, q) {
    var sc = Math.min(1, max / Math.max(w, hgt));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(hgt * sc));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  }
  function camSnap() {
    try {
      var v = $('camV'), w = v.videoWidth, hgt = v.videoHeight;
      if (!w || !hgt) return camDone(null);
      camDone(scaleTo_(v, w, hgt, 1280, .72), scaleTo_(v, w, hgt, 240, .6));
    } catch (e) { camDone(null); }
  }
  function camFilePick() {
    if ($('camTop')) $('camTop').textContent = '📷 카메라로 인증샷을 찍어주세요';
    var f = $('camFile'); f.value = '';
    f.onchange = function () {
      var file = f.files && f.files[0];
      if (!file) return camDone(null);
      var img = new Image();
      img.onload = function () {
        try { camDone(scaleTo_(img, img.width, img.height, 1280, .72), scaleTo_(img, img.width, img.height, 240, .6)); }
        catch (e) { camDone(null); }
        URL.revokeObjectURL(img.src);
      };
      img.onerror = function () { camDone(null); };
      img.src = URL.createObjectURL(file);
    };
    f.click();
  }
  function camDone(photo, thumb) {
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    if (camStream) { try { camStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} camStream = null; }
    document.body.classList.remove('cam-on'); $('cam').innerHTML = '';
    var ctx = camCtx; camCtx = null;
    if (!ctx) return;
    if (thumb) saveShot(hmOf(Date.now()), thumb);
    startActivity(ctx.kind); // (CAMERA_ON일 때만 도달) 사진은 로컬 썸네일만 — v5에서 photo 전송 생략
  }

  /** 전환 이벤트 서버 통지 — 실패해도 타이머·기록은 계속. 실패분은 큐에 남겨 인터넷 복귀 시 자동 재전송 */
  var EVQKEY = 'famevq', flushing = false;
  function qload() { try { return JSON.parse(read(EVQKEY) || '[]') || []; } catch (e) { return []; } }
  function qsave(q) {
    if (q.length > 30) q = q.slice(-30); // 폭주 방지
    try { store(EVQKEY, JSON.stringify(q)); }
    catch (e) { // localStorage 용량 초과 → 사진만 떨궈서라도 알림은 보존
      try { store(EVQKEY, JSON.stringify(q.map(function (x) { return { type: x.type, kind: x.kind, segMin: x.segMin, at: x.at, photo: '' }; }))); } catch (e2) {}
    }
  }
  function sendEvent(type, segMin, photo) {
    fsLiveSet_(type); // 🔥 실시간 라이브 (v55)
    var q = qload();
    q.push({ type: type, kind: sess ? sess.kind : '', segMin: segMin || 0, photo: photo || '', at: Date.now() });
    qsave(q);
    flushEvents();
  }
  function flushEvents() {
    if (flushing || !BOOT || !BOOT.member) return;
    var q = qload();
    if (!q.length) return;
    flushing = true;
    var it = q[0];
    fetch(API, { method: 'POST', body: JSON.stringify({ action: 'practice_event', u: BOOT.member.code, type: it.type, kind: it.kind, segMin: it.segMin, at: it.at, photo: it.photo }), keepalive: true })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        flushing = false;
        var q2 = qload(); q2.shift(); qsave(q2); // 성공 또는 서버 거부(재시도 무의미) → 제거
        if (res && res.error) return;
        flushEvents(); // 다음 항목
      })
      .catch(function () {
        flushing = false; // 네트워크 실패 → 큐에 남김, online 이벤트/다음 전환 때 재시도
        if (it.photo) showToast('인증샷 전송 대기 중 — 인터넷이 연결되면 자동으로 보내요', true);
      });
  }
  window.addEventListener('online', flushEvents);

  // ── 타이머 ──
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) { var s = Math.max(0, Math.floor(ms / 1000)); var m = Math.floor(s / 60); return pad(m) + ':' + pad(s % 60); }
  function human(ms) { var min = Math.round(ms / 60000); if (min < 60) return min + '분'; return Math.floor(min / 60) + '시간' + (min % 60 ? ' ' + (min % 60) + '분' : ''); }
  function segSum(type) {
    if (!sess) return 0;
    var t = 0;
    sess.segments.forEach(function (s) { if (s.type === type) t += s.end - s.start; });
    if (sess.state === type) t += Date.now() - sess.segStart;
    return t;
  }

  function fmtHMS(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h + ':' + pad(m) + ':' + pad(s);
  }
  function localPracticeSec(kind) {
    var t = 0;
    pendingBlocks.forEach(function (b) { if (b.type === 'practice' && (!kind || b.kind === kind)) t += b.end - b.start; }); // 서버 확인 전 블록
    if (sess && sess.state === 'practice' && (!kind || sess.kind === kind)) t += Date.now() - sess.segStart;
    return Math.floor(t / 1000);
  }
  function todaySec(kind) {
    var base = 0;
    if (BOOT && BOOT.today) base = (kind ? (BOOT.today.byKind[kind] || 0) : BOOT.today.totalMin) * 60;
    return base + localPracticeSec(kind || null);
  }

  /** 연습 탭 = 열품타 메인: 날짜+총시간, 좌 과목·할일, 우 타임테이블 */

    var a = Math.max(ax.hs, toMin_(sg.s) / 60), b = Math.min(ax.he, toMin_(sg.e) / 60);

    return { top: ((a - ax.hs) / ax.span * 100).toFixed(2), h: Math.max(0.6, (b - a) / ax.span * 100).toFixed(2) };
  }
  function hourLines_(ax) { var h = ''; for (var i = 0; i <= ax.span; i++) h += '<div class="hl" style="top:' + (i / ax.span * 100).toFixed(1) + '%"></div>'; return h; }
  function axisLabels_(ax, cls) { var h = '', step = ax.span > 12 ? 2 : 1; for (var i = 0; i <= ax.span; i += step) h += '<span class="' + cls + '" style="top:' + (i / ax.span * 100).toFixed(1) + '%">' + (ax.hs + i) + '</span>'; return h; }
  function segColor_(k) { return k === '휴식' ? '#c3cfdb' : subjColor(k); }

  // 주 — 7열 타임테이블 + 요일 합계 + 이번 주 요약 + 🌙 한마디
  function weekHtml_(w) {
    var subs = BOOT.subjects || [], today = todayStr();
    var s = parseD_(w.start), e = parseD_(w.end);
    var label = (s.getMonth() + 1) + '월 ' + s.getDate() + '일 – ' + (e.getMonth() !== s.getMonth() ? (e.getMonth() + 1) + '월 ' : '') + e.getDate() + '일';
    var ax = axisOf_(w.days);
    var head = '<div class="clwhead"><span class="ax"></span>' + w.days.map(function (d) { var dd = parseD_(d.date); return '<span class="' + (d.date === today ? 'today' : '') + (d.future ? ' fut' : '') + '" data-day="' + d.date + '">' + DOW_KO[dd.getDay()] + '<small>' + dd.getDate() + '</small></span>'; }).join('') + '</div>';
    var cols = w.days.map(function (d) {
      var b = (d.segs || []).filter(function (sg) { return !sg.appt; }).map(function (sg) { var p = blkPos_(sg, ax); return p ? '<div class="b" style="top:' + p.top + '%;height:' + p.h + '%;background:' + segColor_(sg.k) + '"></div>' : ''; }).join('');
      return '<div class="col' + (d.date === today ? ' today' : '') + (d.future ? ' fut' : '') + '" data-day="' + d.date + '">' + hourLines_(ax) + b + '</div>';
    }).join('');
    var tots = w.days.map(function (d) { var rest = d.totalMin - d.bassMin; return '<span' + (d.future ? ' class="fut"' : '') + '><b>' + (d.bassMin ? durShort(d.bassMin) : '·') + '</b>' + (rest > 0 ? '+' + durShort(rest) : '') + '</span>'; }).join('');
    var h = '<div class="clcard">' + calNav_(label, shiftD_(mondayOf_(calDate), 7) <= today) + head +
      '<div class="clwk"><div class="ax">' + axisLabels_(ax, '') + '</div>' + cols + '</div>' +
      '<div class="clwtot"><span class="ax"></span>' + tots + '</div>' +
      '<div class="cllg">' + subs.map(function (sb) { return '<span><i style="background:' + esc(sb.color) + '"></i>' + esc(sb.name) + '</span>'; }).join('') + '<span><i style="background:#c3cfdb"></i>휴식</span></div></div>';
    h += '<div class="clcard"><div class="clt">이번 주 <small>' + w.days.filter(function (d) { return !d.future; }).length + '일</small></div>' + statTiles_(w.sum.bassMin, w.sum.perfectDays, w.sum.goalDays) + kindBar_(w.sum.byKind || {}, subs) + '</div>';
    var noteDays = w.days.filter(function (d) { return !d.future; });
    if (noteDays.length) h += '<div class="clcard"><div class="clt">🌙 이번 주 한마디</div><div class="clnotes">' + noteDays.map(function (d) { var dd = parseD_(d.date); return '<span data-day="' + d.date + '"><b' + (d.note ? '' : ' class="dim"') + '>' + DOW_KO[dd.getDay()] + '</b>' + (d.note ? esc(d.note) : '<i>—</i>') + '</span>'; }).join('') + '</div></div>';
    return h;
  }

  // 일 — 세로 타임테이블 + 링 5개 + 메모 + 🌙 한마디
  function dayHtml_(dd) {
    var d = parseD_(dd.date), today = todayStr();
    var label = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOW_KO[d.getDay()] + (dd.date === today ? ' · 오늘' : '');
    var segs = (dd.segs || []).filter(function (sg) { return !sg.appt; });
    var ax = axisOf_([dd]);
    var blocks = segs.map(function (sg) {
      var p = blkPos_(sg, ax); if (!p) return '';
      var sj = subjByName(sg.k), small = +p.h < 3.2, big = +p.h >= 6;
      var lb = sg.k === '휴식' ? '☁️' : (subjIcon(sj) + (small ? '' : ' ' + sg.k) + (big ? ' <small>' + sg.s + '</small>' : ''));
      return '<div class="b" style="top:' + p.top + '%;height:' + p.h + '%;background:' + segColor_(sg.k) + (sg.k === '휴식' ? ';color:#5b6b7a' : '') + '">' + lb + '</div>';
    }).join('');
    var rg = dd.rings && dd.rings.rings || [];
    var rings = rg.map(function (r) {
      var pct = r.goalMin ? Math.min(100, r.doneMin / r.goalMin * 100) : 0;
      var sub = r.mode === 'timer' ? clockHM(r.doneMin) + (r.goalMin ? ' / ' + clockHM(r.goalMin) : '') + (r.done ? ' 🎯' : '') : (r.done ? gl(r.doneMin) + ' ✓' : (r.doneMin ? gl(r.doneMin) : '0') + ' / ' + gl(r.goalMin));
      return '<div class="rg' + (r.done ? ' done' : '') + '" style="--c:' + esc(r.color) + ';--p:' + pct.toFixed(1) + '"><i><b>' + (r.done ? '✓' : subjIcon(r)) + '</b></i><span>' + esc(r.name) + '<small>' + sub + '</small></span></div>';
    }).join('');
    var memos = segs.filter(function (sg) { return sg.memo; }).map(function (sg) {
      var sj = subjByName(sg.k), em = subjIcon(sj), mm = /^《(.+?)》\s*(?:｜\s*(.*))?$/.exec(sg.memo);
      return '<div class="memo"><b>' + em + ' ' + (mm ? '《' + esc(mm[1]) + '》' : esc(sg.k)) + '</b>' + (mm ? esc(mm[2] || '') : esc(sg.memo)) + '</div>';
    }).join('');
    if (dd.note) memos += '<div class="memo nt"><b>🌙 한마디</b>' + esc(dd.note) + '</div>';
    var empty = !segs.length && !memos;
    var h = '<div class="clcard">' + calNav_(label, dd.date < today) +
      (dd.rings && dd.rings.academy ? '<div class="cltag">🏫 학원 날 · 목표 ' + clockHM((rg.find(function (r) { return r.main; }) || {}).goalMin || 0) + '</div>' : '') +
      '<div class="clday"><div class="tt">' + hourLines_(ax) + axisLabels_(ax, 'lb') + blocks + '</div><div class="side">' + rings + memos + (empty ? '<div class="clempty">이날은 기록이 없어요</div>' : '') + '</div></div>' +
      (segs.length ? '<div class="clsum">총 ' + clockHM(dd.totalMin || 0) + ' · ' + segs.filter(function (sg) { return sg.k !== '휴식'; }).length + '블록</div>' : '') +
      ((dd.date < today && BOOT.member.practice && (!statsTarget || statsTarget === BOOT.member.code)) ? '<button class="lnk asmemos" id="dayAdd" data-d="' + esc(dd.date) + '">＋ 이날 기록 추가</button>' : '') + '</div>'; // 깜빡한 기록(v41)
    return h;
  }

  function eventsHtml_(d) {
    if (!d.events || !d.events.length) return '';
    var evNoQ = d.events.filter(function (b) { return !b.quota; });
    var evMax = Math.max.apply(null, evNoQ.map(function (b) { return b.count; }).concat([1]));
    var h = '<div class="sec-label">' + (d.target.practice ? '그 외 일정' : esc(d.target.name) + ' · 일정') + '</div>';
    d.events.forEach(function (b, i) {
      var col = ['#e3a94f', '#8b96f2', '#4fc0af', '#9aa4b2'][i % 4], label, w, full = false;
      if (b.quota > 0) { full = b.count >= b.quota; label = (b.total ? '누적 ' : '') + b.count + '/' + b.quota + '회'; w = Math.min(100, Math.round(b.count / b.quota * 100)); if (full) col = '#4cc27e'; }
      else { label = b.count + '회'; w = Math.max(0, Math.round(b.count / evMax * 100)); }
      h += '<div class="bar-row"><div class="bl">' + esc(b.name) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%;background:' + col + '"></div></div>' +
        '<div class="bar-val' + (full ? ' full' : '') + '">' + label + (full ? ' ✓' : '') + '</div></div>';
    });
    return h;
  }


  // ── 예정 일정 등록 시트 (기존) ──
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nowRounded() { var d = new Date(); d.setMinutes(Math.ceil(d.getMinutes() / 10) * 10, 0, 0); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function durLabel(m) { if (m < 60) return m + '분'; var h = Math.floor(m / 60), r = m % 60; return h + '시간' + (r ? ' ' + r + '분' : ''); }
  function addMin(t, m) { var hm = t.split(':'); var d = new Date(2026, 0, 1, +hm[0], +hm[1] + m); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function diffMin(a, b) { var x = a.split(':'), y = b.split(':'); return (+y[0] * 60 + +y[1]) - (+x[0] * 60 + +x[1]); }

  function applyVariant(v) {
    $('shTime').value = (v && v.p.defStart) || nowRounded();
    curDur = (v && v.p.defDur) || 60; customEnd = false; $('endRow').style.display = 'none';
    renderChips(); updateEnd();
  }
  function openSheet(preset) {
    cur = preset; var custom = !preset; var isGroup = !!(preset && preset.variants);
    $('shTitle').textContent = custom ? '기타 일정' : preset.name;
    $('shSub').textContent = custom ? '이름을 적고 시간을 확인하세요'
      : (preset.whoName ? preset.whoName + ' 일정으로 등록돼요'
        : (isGroup ? '어느 날인지 고르면 시간이 채워져요' : '시간만 확인하고 등록을 누르세요'));
    $('shCustom').style.display = custom ? 'block' : 'none';
    $('shCustom').value = '';
    $('shDate').value = todayStr();
    if (isGroup) {
      $('varLabel').style.display = ''; $('varChips').style.display = '';
      // 오늘 요일에 맞는 변주를 기본 선택 (토→'토…', 일→'일…', 평일→'평일')
      var day = new Date().getDay(), want = day === 6 ? '토' : day === 0 ? '일' : '평일';
      var di = 0;
      preset.variants.forEach(function (v, k) { if (v.variant.indexOf(want) === 0) di = k; });
      var vh = '';
      preset.variants.forEach(function (v, k) { vh += '<button class="chip' + (k === di ? ' on' : '') + '" data-v="' + k + '">' + esc(v.variant) + '</button>'; });
      $('varChips').innerHTML = vh;
      var vcs = document.querySelectorAll('#varChips .chip');
      for (var k = 0; k < vcs.length; k++) (function (c) {
        c.addEventListener('click', function () {
          var vi = +c.getAttribute('data-v');
          for (var j = 0; j < vcs.length; j++) vcs[j].classList.toggle('on', j === vi);
          applyVariant(preset.variants[vi]);
        });
      })(vcs[k]);
      applyVariant(preset.variants[di]);
    } else {
      $('varLabel').style.display = 'none'; $('varChips').style.display = 'none';
      $('shTime').value = (preset && preset.defStart) || nowRounded();
      curDur = (preset && preset.defDur) || 60; customEnd = false; $('endRow').style.display = 'none';
      renderChips(); updateEnd();
    }
    document.body.classList.add('open');
    if (custom) setTimeout(function () { $('shCustom').focus(); }, 250);
  }
  function closeSheet() { document.body.classList.remove('open'); }
  function renderChips() {
    var list = DURS.indexOf(curDur) >= 0 || customEnd ? DURS : DURS.concat([curDur]).sort(function (a, b) { return a - b; });
    var h = '';
    list.forEach(function (m) { h += '<button class="chip' + (!customEnd && m === curDur ? ' on' : '') + '" data-m="' + m + '">' + durLabel(m) + '</button>'; });
    h += '<button class="chip' + (customEnd ? ' on' : '') + '" data-m="custom">직접…</button>';
    $('durChips').innerHTML = h;
    var chips = document.querySelectorAll('#durChips .chip');
    for (var i = 0; i < chips.length; i++) (function (c) {
      c.addEventListener('click', function () {
        var m = c.getAttribute('data-m');
        if (m === 'custom') { customEnd = true; $('endRow').style.display = 'flex'; $('shEnd').value = addMin($('shTime').value || '12:00', curDur); renderChips(); updateEnd(); $('shEnd').focus(); }
        else { customEnd = false; $('endRow').style.display = 'none'; curDur = +m; renderChips(); updateEnd(); }
      });
    })(chips[i]);
  }
  function updateEnd() {
    var t = $('shTime').value || '12:00';
    if (customEnd) {
      var e = $('shEnd').value; var m = e ? diffMin(t, e) : 0;
      if (m > 0) { curDur = m; $('endline').innerHTML = '끝나는 시간 <b>' + e + '</b> · ' + durLabel(m); }
      else $('endline').innerHTML = '<b style="color:var(--danger)">끝나는 시간을 시작보다 뒤로 정해주세요</b>';
      return;
    }
    $('endline').innerHTML = '끝나는 시간 <b>' + addMin(t, curDur) + '</b> · ' + durLabel(curDur);
  }
  function showToast(msg, isErr) { var toast = $('toast'); toast.textContent = msg; toast.className = 'toast show' + (isErr ? ' err' : ''); setTimeout(function () { toast.className = 'toast' + (isErr ? ' err' : ''); }, 2800); }

  $('shTime').addEventListener('input', updateEnd);
  $('shEnd').addEventListener('input', updateEnd);
  $('backdrop').addEventListener('click', function () { closeSheet(); closeTodoSheet(); closeRoutineSheet(); });
  $('ctaBtn').addEventListener('click', function () {
    if (sending) return;
    var title = cur ? cur.name : $('shCustom').value.trim();
    if (!title) { $('shCustom').focus(); return; }
    var d = $('shDate').value.split('-'), t = $('shTime').value.split(':');
    if (d.length !== 3 || t.length !== 2) { showToast('날짜와 시간을 확인해주세요', true); return; }
    if (customEnd && (!$('shEnd').value || diffMin($('shTime').value, $('shEnd').value) <= 0)) { showToast('끝나는 시간을 시작보다 뒤로 정해주세요', true); return; }
    sending = true; var btn = $('ctaBtn'); btn.disabled = true; btn.textContent = '등록 중…';
    var payload = { action: 'register', u: BOOT.member.code, who: (cur && cur.who) || BOOT.member.code, title: title, durationMin: curDur, y: +d[0], mo: +d[1], d: +d[2], h: +t[0], mi: +t[1], memo: '' };
    var subjectName = (cur && cur.whoName) || BOOT.member.name, startLabel = $('shTime').value;
    fetch(API, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        sending = false; btn.disabled = false; btn.textContent = '캘린더에 등록';
        if (res && res.error) { showToast(res.error, true); return; }
        BOOT = res; saveBoot(res); famcalCache = {}; render(); closeSheet();
        var rg = res.registered; showToast('등록 완료 — ' + title + ' (' + subjectName + ') ' + startLabel + ((rg && rg.seq && rg.total) ? ' · ' + rg.seq + '/' + rg.total + '회' : '') + ', 가족 캘린더에 올라갔어요');
      })
      .catch(function () { sending = false; btn.disabled = false; btn.textContent = '캘린더에 등록'; showToast('등록에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.', true); });
  });

  // 앱 복귀 시 재조회 (폴링 없음 — GAS 부하 최소): 모든 화면에서 마지막 조회 60초 이후면 init (v45 — 과목 설정 등 서버 변경이 폰에 바로 반영). 뷰어 홈은 항상(라이브 상태)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !BOOT || !BOOT.member) return;
    flushBlocks(); flushEvents(); // 밀린 저장부터 (v53)
    checkUpdate_(); // 새 버전이면 새로고침 (아래)
    if ((isViewer() && view === 'feed') || Date.now() - lastInitAt > 60000) init();
  });
  // ── 새 버전 자동 반영 (v45): 복귀 때 서버 index.html HEAD ETag가 바뀌었으면 본문 마커(<!-- vNN)를 읽어 APP_VER보다 크면 새로고침. 시트·집중 화면 중엔 미룸(다음 복귀 때) ──
  var APP_VER = 58, appEtag = null;
  function checkUpdate_() {
    fetch('index.html', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var et = r.headers.get('ETag') || r.headers.get('Last-Modified') || '';
      if (!et) return;
      if (appEtag === null) { appEtag = et; return; }
      if (et === appEtag) return;
      return fetch('index.html?nc=' + Date.now(), { cache: 'no-store' }).then(function (r2) { return r2.text(); }).then(function (html) {
        var m = /var APP_VER = (\d+)/.exec(html); appEtag = et; // 서버 본문의 APP_VER만 비교 — 올릴 곳은 이 상수 하나
        if (!m || +m[1] <= APP_VER) return;
        var busy = ['open', 'rt-open', 'todo-open', 'measuring', 'review-on'].some(function (c) { return document.body.classList.contains(c); }) || bq().length > 0 || qload().length > 0; // 저장 큐 비기 전 reload 금지 (v53)
        if (busy) { appEtag = null; return; } // 다음 복귀 때 다시
        showToast('새 버전으로 새로고침해요 (v' + m[1] + ')');
        setTimeout(function () { location.reload(); }, 900);
      });
    }).catch(function () {});
  }
  setTimeout(checkUpdate_, 3000); // 현재 ETag 기억

  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  init();
</script>
